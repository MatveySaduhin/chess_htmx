<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chess-board {
            width: 480px;
            height: 480px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 2px solid #333;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .light {
            background-color: #f0d9b5;
        }

        .dark {
            background-color: #b58863;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Chess Game</h1>
            <p class="text-gray-600">Game ID: {{.GameID}}</p>
            <p class="text-gray-600">Your colour: {{.Color}}</p>
        </header>

        <div class="flex justify-center">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <!-- Static Chess Board -->
                <div id="chess-board" class="chess-board mx-auto mb-4">
                    <!-- Board will be generated by JavaScript -->
                </div>

                <!-- Game Info -->
                <div class="text-center space-y-4">
                    <div class="text-gray-700">
                        <p>Share this link with your opponent:</p>
                        <p class="font-mono text-blue-600">/game/{{.GameID}}</p>
                    </div>

                    <div class="flex justify-center space-x-4">
                        <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                            onclick="copyGameLink()">
                            Copy Game Link
                        </button>
                        <button class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700"
                            onclick="window.location.href='/'">
                            Back to Home
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate chess board
        document.addEventListener('DOMContentLoaded', function () {
            const board = document.getElementById('chess-board');
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

            // Create 8x8 board (ranks 8 to 1)
            for (let rank = 8; rank >= 1; rank--) {
                for (let fileIndex = 0; fileIndex < 8; fileIndex++) {
                    const square = document.createElement('div');
                    const isLight = (rank + fileIndex) % 2 === 0;
                    const file = files[fileIndex];

                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.square = file + rank;
                    square.title = file + rank; // Show coordinate on hover

                    board.appendChild(square);
                }
            }
        });

        // Copy game link to clipboard
        function copyGameLink() {
            const gameLink = window.location.href;
            navigator.clipboard.writeText(gameLink).then(() => {
                alert('Game link copied to clipboard! Share it with your opponent.');
            }).catch(() => {
                // Fallback for older browsers
                prompt('Copy this game link:', gameLink);
            });
        }
    </script>
</body>

</html>
