<!-- templates/game.html -->
{{template "base.html" .}}

{{define "content"}}
<div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Chess Game</h1>
    <p class="text-gray-600 mb-6">Game ID: {{.GameID}}</p>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Chess Board -->
        <div class="lg:col-span-2">
            <div id="chess-board" class="bg-white rounded-lg shadow-lg p-4">
                {{template "chess_board" .}}
            </div>
        </div>
        
        <!-- Game Info -->
        <div class="space-y-4">
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-semibold text-gray-700 mb-2">Game Status</h3>
                <div id="game-status">Waiting for players...</div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-semibold text-gray-700 mb-2">Moves</h3>
                <div id="moves-list" class="max-h-60 overflow-y-auto"></div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-semibold text-gray-700 mb-2">Players</h3>
                <div id="players-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
// WebSocket connection will be added in Phase 6
</script>
{{end}}
