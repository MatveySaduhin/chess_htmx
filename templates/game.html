<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chess Game: {{.GameID}}</title>

    <!-- jQuery (required by chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Chessboard.js -->
    <link rel="stylesheet" href="/static/css/chessboard-1.0.0.min.css">
    <script src="/static/js/chessboard-1.0.0.min.js"></script>

    <!-- chess.js from CDN (global version) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .game-container {
            text-align: center;
        }

        .board-disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        #myBoard {
            width: 600px;
        }

        #gameStatus {
            margin-top: 10px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="game-data" data-gameid="{{.GameID}}" data-color="{{.Color}}" style="display: none;"></div>

    <!-- Game container -->
    <div class="game-container">
        <h1>Chess Game: {{.GameID}}</h1>
        <p>You are playing as: <strong>{{.Color}}</strong></p>
        <div id="myBoard"></div>
        <div id="gameStatus"></div>
    </div>

    <script src="/static/js/game.js"></script>
</body>

</html>
