{{define "auth.html"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess App - Sign In</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/easy-auth.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <a href="/" class="text-2xl font-bold text-gray-800">♞ Chess App</a>
                <div class="flex items-center space-x-4">
                    <a href="/auth" class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Sign In</a>
                    <a href="/registration"
                        class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <header class="text-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-800">Sign In</h1>
                </header>
                <form id="login-form">
                    <div class="space-y-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="email" name="email" required
                                class="mt-1 w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" name="password" id="password" required
                                class="mt-1 w-full px-3 py-2 border rounded-lg">
                        </div>
                    </div>
                    <div id="result" class="mt-4 min-h-[1.5rem] text-sm"></div>
                    <button type="submit"
                        class="mt-4 w-full py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700">
                        SIGN IN
                    </button>
                </form>
            </div>
        </div>
    </main>
    <script>
        const authPageResult = document.getElementById("result");
        if (new URLSearchParams(window.location.search).get("registered") === "1") {
            authPageResult.className = "mt-4 min-h-[1.5rem] text-sm text-green-600";
            authPageResult.textContent = "Account created. Please sign in.";
        }

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const result = document.getElementById("result");
            result.textContent = "";

            const formData = new FormData(event.currentTarget);
            const response = await fetch("/api/easy-auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(Object.fromEntries(formData.entries()))
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                result.className = "mt-4 min-h-[1.5rem] text-sm text-red-600";
                result.textContent = easyAuthErrorMessage(data, "Sign in failed");
                return;
            }

            storeEasyAuthTokens(data);

            try {
                await loadCurrentProfile();
            } catch (error) {
                result.className = "mt-4 min-h-[1.5rem] text-sm text-red-600";
                result.textContent = "Signed in, but chess profile could not be loaded";
                return;
            }

            window.location.href = "/";
        });
    </script>
</body>

</html>
{{end}}
