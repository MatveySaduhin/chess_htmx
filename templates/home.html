<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header with User Info -->
        <header class="text-center mb-12 relative">
            <!-- User Info in top right -->
            {{if .UserName}}
            <div class="absolute top-0 right-0">
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700">Welcome, <strong>{{.UserName}}</strong>!</span>
                    <button class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
                        hx-post="/logout" hx-target="body">
                        Logout
                    </button>
                </div>
            </div>
            {{end}}

            <h1 class="text-4xl font-bold text-gray-800 mb-2">♞ Chess App</h1>
            <p class="text-gray-600">Play chess in real-time</p>
        </header>

        <!-- Main Actions -->
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6 space-y-4">
            {{if .UserName}}
            <button class="w-full py-3 bg-amber-600 text-white rounded-lg font-semibold
                              hover:bg-amber-700 transition-colors duration-200
                              shadow-md hover:shadow-lg" hx-post="/create-game" hx-targer="#game-section">
                Create game
            </button>

            <!-- Quick Play - Find waiting games -->
            <button class="w-full py-3 bg-blue-600 text-white rounded-lg font-semibold
                          hover:bg-blue-700 transition-colors duration-200" hx-get="/waiting-games"
                hx-target="#game-section">
                Quick Play (Find Opponent)
            </button>

            <!-- Join Game Form - Using HTMX -->
            <div class="border-t pt-4">
                <h3 class="font-semibold text-gray-700 mb-2">Join Existing Game</h3>
                <form hx-post="/join-game" hx-target="#game-section" class="flex space-x-2">
                    <input type="text" name="game_id" placeholder="Game ID"
                        class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                    <button type="submit"
                        class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors">
                        Join
                    </button>
                </form>
            </div>

            <div id="game-section"></div>
            {{else}}
            <!-- Show sign in options for anonymous users -->
            <div class="text-center space-y-4">
                <p class="text-gray-600">Please sign in to play chess</p>
                <button class="w-full py-3 bg-green-600 text-white rounded-lg font-semibold
                                  hover:bg-green-700 transition-colors duration-200" hx-get="/auth" hx-push-url="true"
                    hx-target="body">
                    SIGN IN
                </button>
                <p class="text-sm text-gray-500">Or <a href="/auth" class="text-blue-600 hover:underline">create an
                        account</a></p>
            </div>
            {{end}}
        </div>
    </div>
</body>

</html>
